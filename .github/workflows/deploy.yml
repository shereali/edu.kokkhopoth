name: CI/CD Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  # ==========================================================
  # Stage 1: Detect Changes (Smart Path Filtering)
  # ==========================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      infra: ${{ steps.filter.outputs.infra }}
      any: ${{ steps.any.outputs.any }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package*.json'
              - 'vite.config.*'
              - 'tailwind.config.*'
              - 'postcss.config.*'
              - 'tsconfig*.json'
              - 'Dockerfile'
              - 'deploy/nginx.conf'
            infra:
              - 'docker-compose*.yml'
              - 'deploy/**'
              - '.github/**'

      - name: Compute Execution Trigger
        id: any
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ steps.filter.outputs.frontend }}" = "true" ] || \
             [ "${{ steps.filter.outputs.infra }}" = "true" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================================
  # Stage 2: Frontend CI Quality Gate (Vite Production Build)
  # ==========================================================
  ci-frontend:
    name: Frontend (Vue 3 + Vite Build Check)
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Production Build Verification
        run: npm run build-only

  # ==========================================================
  # Stage 3: Build & Push Image to GHCR (Zero VPS Compilation)
  # ==========================================================
  build-push:
    name: Build & Push Image
    if: always() && needs.changes.outputs.any == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, ci-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/frontend:latest
            ${{ env.IMAGE_BASE }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ==========================================================
  # Stage 4: Zero-Load, Zero-Downtime VPS Deployment
  # ==========================================================
  deploy:
    name: Deploy to VPS
    if: always() && needs.changes.outputs.any == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs: [changes, build-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Secure SSH Deployment Key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if echo "$SSH_KEY" | grep -q -- "-----BEGIN"; then
            printf "%s\n" "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null || {
            echo "::error::SSH Key secret is invalid or corrupted. Check VPS_SSH_KEY in repository secrets."
            exit 1
          }

          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test Server SSH Connectivity (Pre-Flight)
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -o ConnectTimeout=15 "$USER@$HOST" "echo Connected successfully as: \$(whoami)"

      - name: Sync Compose & Deploy Configurations
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')

          scp -i ~/.ssh/deploy_key -P "$PORT" -o StrictHostKeyChecking=accept-new -r docker-compose.yml deploy "$USER@$HOST:/var/www/$USER/"

      - name: Trigger Zero-Downtime Deployment on VPS
        env:
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          USER=$(echo "$SSH_USER" | tr -d '[:space:]')
          HOST=$(echo "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(echo "${SSH_PORT:-22}" | tr -d '[:space:]')

          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USER' --password-stdin && \
             IMAGE_TAG='$IMAGE_TAG' \
             REGISTRY='ghcr.io' \
             REPOSITORY_OWNER='${{ github.repository_owner }}' \
             bash /var/www/$USER/deploy/deploy.sh"

