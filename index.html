<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link id="favicon" rel="icon" href="" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kokkhopoth</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
  <script>
    const siteInfo = localStorage.getItem('siteInfo')
    const jsonSiteInfo = siteInfo ? JSON.parse(siteInfo) : null
    function addFavicon(faviconUrl) {
      if (!faviconUrl) return
      let existingFavicon = document.querySelector('link[rel="icon"]')
      if (existingFavicon) {
        existingFavicon.parentNode.removeChild(existingFavicon)
      }
      const link = document.createElement('link')
      link.rel = 'icon'
      link.type = 'image/png'
      link.href = faviconUrl
      document.head.appendChild(link)
    }

    if (jsonSiteInfo && jsonSiteInfo.favicon_view) {
      addFavicon(jsonSiteInfo.favicon_view)
    }
  </script>
</body>

</html>
